<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F3E7E2">
  <meta name="description" content="Aprenda vocabulário novo todos os dias, no seu ritmo">
  <title>Palavra do Dia</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Palavra do Dia">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ivory:      #FBF7F3;
      --blush:      #F4E9E4;
      --rose:       #E7D2CD;
      --rose-deep:  #CFAEA9;
      --mauve:      #9C777A;
      --gold-deep:  #8A6733;
      --gold:       #B08D57;
      --gold-light: #EBD9AC;
      --ink:        #443733;
      --ink-soft:   #8B7871;
      --hairline:   #E2D2CB;

      --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
      --sans: 'Jost', 'Futura', 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      --shell: 480px;
    }

    html, body { width: 100%; min-height: 100%; }

    body {
      font-family: var(--sans);
      font-weight: 300;
      background: var(--ivory);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior-y: none;
    }

    #root { min-height: 100vh; display: flex; flex-direction: column; }

    .shell { width: 100%; max-width: var(--shell); margin: 0 auto; }

    /* ---------- Gold ---------- */
    .gold-text {
      background-image: linear-gradient(96deg,
        var(--gold-deep) 0%, var(--gold) 26%, #D8BE86 46%,
        #E4CE9A 50%, #D8BE86 54%, var(--gold) 74%, var(--gold-deep) 100%);
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sheen 9s linear infinite;
    }

    @keyframes sheen { to { background-position: 250% center; } }

    .gold-rule {
      height: 1px; border: 0;
      background-image: linear-gradient(90deg,
        transparent, var(--rose-deep) 18%, var(--gold) 50%, var(--rose-deep) 82%, transparent);
    }

    /* ---------- Header ---------- */
    header {
      position: sticky; top: 0; z-index: 60;
      background: linear-gradient(180deg, var(--blush) 0%, #F8EFEA 100%);
      border-bottom: 1px solid var(--hairline);
      padding-top: env(safe-area-inset-top);
    }

    /* motivo geométrico próprio: losangos finos, bem discretos */
    .header-motif {
      height: 22px;
      background-image:
        repeating-linear-gradient(45deg, var(--gold) 0 1px, transparent 1px 22px),
        repeating-linear-gradient(-45deg, var(--gold) 0 1px, transparent 1px 22px);
      opacity: 0.13;
    }

    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 6px 22px 14px;
    }

    .brand { display: flex; flex-direction: column; gap: 1px; }

    .brand-name {
      font-family: var(--serif);
      font-size: 27px; font-weight: 500; letter-spacing: 0.5px; line-height: 1.15;
    }

    .brand-sub {
      font-size: 8.5px; font-weight: 400; letter-spacing: 3.4px;
      text-transform: uppercase; color: var(--mauve);
    }

    .bell {
      flex-shrink: 0;
      width: 42px; height: 42px; border-radius: 50%;
      background: transparent;
      border: 1px solid var(--rose-deep);
      color: var(--gold-deep);
      font-family: var(--serif); font-size: 17px;
      display: grid; place-items: center;
      cursor: pointer; transition: background 0.35s ease, border-color 0.35s ease;
    }

    .bell:hover, .bell:focus-visible { background: rgba(176,141,87,0.09); border-color: var(--gold); }
    .bell:active { background: rgba(176,141,87,0.18); }

    nav.tabs { display: flex; border-top: 1px solid var(--hairline); }

    .tab {
      flex: 1; padding: 13px 6px 12px;
      background: none; border: 0; border-bottom: 1.5px solid transparent;
      font-family: var(--sans); font-size: 10px; font-weight: 400;
      letter-spacing: 2.1px; text-transform: uppercase;
      color: var(--ink-soft); cursor: pointer;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    .tab[aria-selected="true"] { color: var(--gold-deep); border-bottom-color: var(--gold); }

    /* ---------- Layout ---------- */
    main { flex: 1; padding: 26px 22px calc(40px + env(safe-area-inset-bottom)); }

    .panel { display: none; }
    .panel.active { display: block; animation: rise 0.5s cubic-bezier(.2,.7,.3,1) both; }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .eyebrow {
      font-size: 9px; font-weight: 400; letter-spacing: 3px;
      text-transform: uppercase; color: var(--mauve);
    }

    /* ---------- Contador ---------- */
    .ledger {
      display: flex; align-items: stretch;
      border: 1px solid var(--hairline); border-radius: 2px;
      background: linear-gradient(180deg, #FFFDFB, var(--blush));
      margin-bottom: 26px;
    }

    .ledger-cell { flex: 1; padding: 15px 10px 13px; text-align: center; }
    .ledger-cell + .ledger-cell { border-left: 1px solid var(--hairline); }

    .ledger-n {
      font-family: var(--serif); font-size: 30px; font-weight: 400; line-height: 1.1;
      font-variant-numeric: tabular-nums; margin-top: 3px;
    }

    /* ---------- Carta da palavra ---------- */
    .card {
      position: relative;
      background: linear-gradient(168deg, #FFFDFC 0%, #FDF7F4 55%, var(--blush) 100%);
      border: 1px solid var(--rose);
      border-radius: 3px;
      padding: 30px 24px 26px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(140,107,58,0.05), 0 14px 34px -22px rgba(112,80,70,0.35);
    }

    .card::before {
      content: ''; position: absolute; inset: 7px;
      border: 1px solid rgba(176,141,87,0.26);
      border-radius: 1px; pointer-events: none;
    }

    .card-head {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 16px;
    }

    .card-head .dash { flex: 1; height: 1px; background: var(--rose-deep); opacity: 0.55; max-width: 46px; }

    .theme-tag { font-size: 8.5px; letter-spacing: 2.6px; text-transform: uppercase; color: var(--mauve); }

    .word {
      font-family: var(--serif);
      font-size: clamp(34px, 10.5vw, 46px);
      font-weight: 500; line-height: 1.12; text-align: center;
      letter-spacing: 0.2px; text-wrap: balance;
    }

    .word-tr {
      font-family: var(--serif); font-style: italic; font-size: 17px;
      text-align: center; color: var(--ink-soft); margin-top: 7px;
    }

    .example {
      margin: 22px 0 20px; padding: 17px 18px 16px;
      background: rgba(231,210,205,0.34);
      border-left: 2px solid var(--gold);
      border-radius: 1px;
    }

    .example-label { font-size: 8.5px; letter-spacing: 2.6px; text-transform: uppercase; color: var(--gold-deep); }

    .example-src {
      font-family: var(--serif); font-size: 18px; font-style: italic;
      line-height: 1.55; margin-top: 9px;
    }

    .example-tr {
      font-size: 12.5px; line-height: 1.55; color: var(--ink-soft);
      margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(207,174,169,0.5);
    }

    /* ---------- Botões ---------- */
    .btn {
      display: block; width: 100%;
      padding: 13px 16px;
      font-family: var(--sans); font-size: 10px; font-weight: 400;
      letter-spacing: 2.4px; text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--rose-deep); border-radius: 2px;
      cursor: pointer; transition: all 0.35s ease;
    }

    .btn:hover, .btn:focus-visible { border-color: var(--gold); background: rgba(176,141,87,0.06); }
    .btn:active { transform: scale(0.99); }

    .btn.done {
      border-color: var(--gold);
      background: linear-gradient(100deg, rgba(176,141,87,0.14), rgba(235,217,172,0.28));
      color: var(--gold-deep);
    }

    /* ---------- Carta bloqueada ---------- */
    .card.locked { background: linear-gradient(168deg, #FCF9F7, #F6EFEB); border-style: dashed; box-shadow: none; }
    .card.locked::before { border-style: dashed; opacity: 0.5; }

    .locked-body { text-align: center; padding: 12px 0 4px; }

    .locked-time {
      font-family: var(--serif); font-size: 32px; font-weight: 400;
      font-variant-numeric: tabular-nums; margin: 6px 0 4px;
    }

    .locked-note { font-size: 11.5px; color: var(--ink-soft); }

    .reveal {
      margin-top: 14px; padding: 7px 15px;
      font-family: var(--sans); font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold-deep); background: transparent;
      border: 1px solid var(--rose-deep); border-radius: 999px; cursor: pointer;
      transition: all 0.3s ease;
    }

    .reveal:hover, .reveal:focus-visible { border-color: var(--gold); background: rgba(176,141,87,0.07); }

    /* ---------- Lista de aprendidas ---------- */
    .learned-list { display: flex; flex-direction: column; }

    .learned-item {
      padding: 15px 2px; border-bottom: 1px solid var(--hairline);
      cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0;
      width: 100%; text-align: left; font-family: inherit; color: inherit;
    }

    .learned-row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }

    .learned-word { font-family: var(--serif); font-size: 20px; font-weight: 500; }
    .learned-tr { font-family: var(--serif); font-style: italic; font-size: 13.5px; color: var(--ink-soft); margin-top: 2px; }
    .learned-meta { font-size: 9.5px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--mauve); white-space: nowrap; }

    .learned-detail { display: none; margin-top: 12px; padding: 13px 14px; background: rgba(231,210,205,0.3); border-radius: 1px; }
    .learned-detail.open { display: block; }
    .learned-detail .src { font-family: var(--serif); font-style: italic; font-size: 15.5px; line-height: 1.5; }
    .learned-detail .tr { font-size: 12px; color: var(--ink-soft); margin-top: 7px; }

    .empty {
      text-align: center; padding: 46px 24px;
      border: 1px dashed var(--rose-deep); border-radius: 2px;
    }

    .empty-mark { font-family: var(--serif); font-size: 34px; color: var(--gold); }
    .empty p { font-family: var(--serif); font-size: 16px; font-style: italic; color: var(--ink-soft); margin-top: 8px; }

    /* ---------- Ajustes ---------- */
    .field { padding: 20px 0; border-bottom: 1px solid var(--hairline); }
    .field:first-of-type { padding-top: 4px; }

    .field-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 13px; }
    .field-title { font-family: var(--serif); font-size: 19px; font-weight: 500; }
    .field-note { font-size: 11.5px; line-height: 1.5; color: var(--ink-soft); margin-top: -6px; margin-bottom: 13px; }

    select, input[type="time"] {
      width: 100%; padding: 11px 13px;
      font-family: var(--sans); font-size: 15px; font-weight: 300; color: var(--ink);
      background: #FFFDFC;
      border: 1px solid var(--rose-deep); border-radius: 2px;
      cursor: pointer;
    }

    select:focus, input[type="time"]:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(176,141,87,0.12); }

    .chips { display: flex; flex-wrap: wrap; gap: 7px; }

    .chip {
      padding: 8px 13px;
      font-family: var(--sans); font-size: 10px; font-weight: 400;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid var(--hairline); border-radius: 999px;
      cursor: pointer; transition: all 0.3s ease;
    }

    .chip[aria-pressed="true"] {
      color: var(--gold-deep); border-color: var(--gold);
      background: linear-gradient(100deg, rgba(176,141,87,0.1), rgba(235,217,172,0.22));
    }

    .chip-sub { display: block; font-size: 8px; letter-spacing: 1px; opacity: 0.7; text-transform: none; margin-top: 1px; }

    .segmented { display: flex; border: 1px solid var(--rose-deep); border-radius: 2px; overflow: hidden; }

    .seg {
      flex: 1; padding: 11px 4px;
      font-family: var(--sans); font-size: 11px; letter-spacing: 1.6px;
      background: transparent; border: 0; color: var(--ink-soft); cursor: pointer;
      transition: all 0.3s ease;
    }

    .seg + .seg { border-left: 1px solid var(--hairline); }

    .seg[aria-pressed="true"] {
      color: var(--gold-deep);
      background: linear-gradient(100deg, rgba(176,141,87,0.12), rgba(235,217,172,0.24));
    }

    .times { display: flex; flex-direction: column; gap: 10px; }

    .time-row { display: flex; align-items: center; gap: 12px; }

    .time-label {
      flex-shrink: 0; width: 74px;
      font-size: 9px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--mauve);
    }

    .switch {
      flex-shrink: 0; position: relative;
      width: 48px; height: 26px; border-radius: 999px;
      background: var(--rose); border: 1px solid var(--rose-deep);
      cursor: pointer; transition: all 0.4s ease;
    }

    .switch[aria-pressed="true"] {
      background: linear-gradient(100deg, var(--gold), var(--gold-light));
      border-color: var(--gold-deep);
    }

    .knob {
      position: absolute; top: 2px; left: 2px;
      width: 20px; height: 20px; border-radius: 50%;
      background: #FFFDFA; box-shadow: 0 1px 3px rgba(68,55,51,0.28);
      transition: left 0.4s cubic-bezier(.3,.7,.3,1);
    }

    .switch[aria-pressed="true"] .knob { left: 24px; }

    .colophon {
      margin-top: 26px; padding-top: 20px;
      border-top: 1px solid var(--hairline);
      text-align: center;
    }

    .colophon p { font-size: 11px; line-height: 1.8; color: var(--ink-soft); }
    .colophon .mark { font-family: var(--serif); font-size: 20px; letter-spacing: 4px; }

    /* ---------- Aviso de atualização ---------- */
    .update-bar {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 200; max-width: 456px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
      padding: 13px 15px;
      background: linear-gradient(120deg, #4B3C36, #5C4A41);
      border: 1px solid var(--gold); border-radius: 3px;
      box-shadow: 0 12px 34px -12px rgba(68,55,51,0.55);
      animation: rise 0.45s ease both;
    }

    .update-bar p { flex: 1; font-size: 12px; line-height: 1.45; color: #F6ECE2; }

    .update-bar button {
      flex-shrink: 0; padding: 9px 14px;
      font-family: var(--sans); font-size: 9.5px; letter-spacing: 1.8px; text-transform: uppercase;
      color: #3A2E29; background: linear-gradient(100deg, var(--gold-light), #F6E9C6);
      border: 0; border-radius: 2px; cursor: pointer;
    }

    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      .gold-text { animation: none; background-position: 50% center; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="update-slot"></div>

  <script src="vocab.js"></script>
  <script>
  (function () {
    'use strict';

    var DEFAULT_TIMES = { 1: ['09:00'], 2: ['09:00', '19:00'], 3: ['08:00', '13:00', '20:00'] };
    var SLOT_NAMES = ['Manhã', 'Tarde', 'Noite'];

    function hashStr(s) {
      var h = 2166136261;
      for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
      return h >>> 0;
    }

    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function shuffled(arr, rnd) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(rnd() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function todayKey() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function minutesNow() {
      var d = new Date();
      return d.getHours() * 60 + d.getMinutes();
    }

    function toMinutes(hhmm) {
      var p = String(hhmm || '00:00').split(':');
      return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
    }

    function themeById(id) {
      for (var i = 0; i < THEMES.length; i++) if (THEMES[i].id === id) return THEMES[i];
      return null;
    }

    var App = {
      settings: null,
      learned: [],
      tab: 'today',
      openDetail: null,
      notified: {},
      revealed: {},

      get: function (k, fb) {
        try { var v = localStorage.getItem(k); return v === null ? fb : v; } catch (e) { return fb; }
      },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },

      loadSettings: function () {
        var raw = this.get('settings_v2', null);
        var s = null;
        if (raw) { try { s = JSON.parse(raw); } catch (e) { s = null; } }
        if (!s) {
          s = {
            language: 'italiano',
            themes: THEMES.map(function (t) { return t.id; }),
            perDay: 1,
            mode: 'varied',
            times: DEFAULT_TIMES[1].slice(),
            notify: false
          };
        }
        if (!VOCAB[s.language]) s.language = 'italiano';
        if (!Array.isArray(s.themes) || !s.themes.length) s.themes = THEMES.map(function (t) { return t.id; });
        if ([1, 2, 3].indexOf(s.perDay) === -1) s.perDay = 1;
        if (!Array.isArray(s.times) || s.times.length !== s.perDay) s.times = DEFAULT_TIMES[s.perDay].slice();
        this.settings = s;
      },

      saveSettings: function () {
        this.set('settings_v2', JSON.stringify(this.settings));
      },

      availableThemes: function () {
        var lang = VOCAB[this.settings.language];
        return this.settings.themes.filter(function (id) {
          return lang[id] && lang[id].length;
        });
      },

      picksForToday: function () {
        var s = this.settings;
        var lang = VOCAB[s.language];
        var avail = this.availableThemes();
        if (!avail.length) return [];

        var seed = hashStr(todayKey() + '|' + s.language + '|' + s.perDay + '|' + s.mode + '|' + s.themes.join(','));
        var rnd = mulberry32(seed);
        var picks = [];

        if (s.mode === 'same' || avail.length === 1) {
          var theme = avail[Math.floor(rnd() * avail.length)];
          var order = shuffled(lang[theme].map(function (_, i) { return i; }), rnd);
          for (var i = 0; i < s.perDay; i++) picks.push({ theme: theme, idx: order[i % order.length] });
        } else {
          var themeOrder = shuffled(avail, rnd);
          for (var j = 0; j < s.perDay; j++) {
            var th = themeOrder[j % themeOrder.length];
            var pool = shuffled(lang[th].map(function (_, i) { return i; }), rnd);
            picks.push({ theme: th, idx: pool[0] });
          }
        }
        return picks;
      },

      entry: function (pick) {
        var e = VOCAB[this.settings.language][pick.theme][pick.idx];
        return { word: e[0], tr: e[1], ex: e[2], exTr: e[3], theme: pick.theme };
      },

      isUnlocked: function (i) {
        if (this.revealed[todayKey() + '#' + i]) return true;
        return minutesNow() >= toMinutes(this.settings.times[i]);
      },

      revealNow: function (i) {
        this.revealed[todayKey() + '#' + i] = true;
        this.set('revealed', JSON.stringify(this.revealed));
        this.render();
      },

      isLearned: function (word) {
        for (var i = 0; i < this.learned.length; i++) if (this.learned[i].word === word) return true;
        return false;
      },

      toggleLearned: function (i) {
        var e = this.entry(this.picksForToday()[i]);
        if (this.isLearned(e.word)) {
          this.learned = this.learned.filter(function (x) { return x.word !== e.word; });
        } else {
          e.lang = this.settings.language;
          e.date = new Date().toLocaleDateString('pt-BR');
          this.learned.push(e);
        }
        this.set('learned_v2', JSON.stringify(this.learned));
        this.render();
      },

      /* ---------- Notificações ---------- */
      notify: function (i) {
        var picks = this.picksForToday();
        if (!picks[i] || !('Notification' in window)) return;
        var e = this.entry(picks[i]);
        var title = 'Palavra do dia · ' + e.word;
        var body = e.tr + ' — ' + e.ex;
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.ready) {
            navigator.serviceWorker.ready.then(function (reg) {
              reg.showNotification(title, { body: body, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'palavra-' + i });
            }).catch(function () { new Notification(title, { body: body }); });
          } else {
            new Notification(title, { body: body });
          }
        } catch (err) {}
      },

      askNotify: function () {
        var self = this;
        if (!('Notification' in window)) return Promise.resolve('unsupported');
        if (Notification.permission === 'granted') return Promise.resolve('granted');
        return Notification.requestPermission().then(function (p) {
          if (p !== 'granted') { self.settings.notify = false; self.saveSettings(); self.render(); }
          return p;
        }).catch(function () { return 'error'; });
      },

      tick: function () {
        if (!this.settings.notify) return;
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        var day = todayKey();
        var now = minutesNow();
        for (var i = 0; i < this.settings.perDay; i++) {
          var key = day + '#' + i;
          if (this.notified[key]) continue;
          var t = toMinutes(this.settings.times[i]);
          if (now >= t && now - t < 90) { this.notified[key] = true; this.notify(i); }
        }
        this.set('notified', JSON.stringify(this.notified));
      },

      /* ---------- Ações da interface ---------- */
      setTab: function (t) { this.tab = t; this.render(); },

      setLanguage: function (v) { this.settings.language = v; this.saveSettings(); this.render(); },

      toggleTheme: function (id) {
        var s = this.settings;
        var i = s.themes.indexOf(id);
        if (i === -1) s.themes.push(id);
        else if (s.themes.length > 1) s.themes.splice(i, 1);
        this.saveSettings(); this.render();
      },

      setPerDay: function (n) {
        this.settings.perDay = n;
        this.settings.times = DEFAULT_TIMES[n].slice();
        this.saveSettings(); this.render();
      },

      setMode: function (m) { this.settings.mode = m; this.saveSettings(); this.render(); },

      setTime: function (i, v) {
        if (!v) return;
        this.settings.times[i] = v;
        this.saveSettings(); this.render();
      },

      toggleNotify: function () {
        var self = this;
        this.settings.notify = !this.settings.notify;
        this.saveSettings();
        if (this.settings.notify) this.askNotify().then(function () { self.render(); });
        else this.render();
      },

      toggleDetail: function (i) {
        this.openDetail = this.openDetail === i ? null : i;
        this.render();
      },

      /* ---------- Telas ---------- */
      todayPanel: function () {
        var self = this;
        var s = this.settings;
        var picks = this.picksForToday();
        var week = this.learned.filter(function (w) {
          var p = String(w.date || '').split('/');
          if (p.length !== 3) return false;
          var d = new Date(p[2], p[1] - 1, p[0]);
          var ago = new Date(); ago.setDate(ago.getDate() - 7);
          return d >= ago;
        }).length;

        var html =
          '<div class="ledger">' +
            '<div class="ledger-cell"><div class="eyebrow">No total</div><div class="ledger-n">' + this.learned.length + '</div></div>' +
            '<div class="ledger-cell"><div class="eyebrow">Na semana</div><div class="ledger-n">' + week + '</div></div>' +
            '<div class="ledger-cell"><div class="eyebrow">Por dia</div><div class="ledger-n">' + s.perDay + '</div></div>' +
          '</div>';

        if (!picks.length) {
          return html + '<div class="empty"><div class="empty-mark">&#10086;</div><p>Nenhum tema escolhido.<br>Selecione ao menos um em Ajustes.</p></div>';
        }

        picks.forEach(function (p, i) {
          var e = self.entry(p);
          var th = themeById(p.theme);
          var themeLabel = s.language === 'italiano' ? th.it : th.pt;

          if (!self.isUnlocked(i)) {
            html +=
              '<article class="card locked">' +
                '<div class="card-head"><span class="dash"></span><span class="theme-tag">' + esc(themeLabel) + '</span><span class="dash"></span></div>' +
                '<div class="locked-body">' +
                  '<div class="eyebrow">' + esc(SLOT_NAMES[i] || ('Palavra ' + (i + 1))) + '</div>' +
                  '<div class="locked-time">' + esc(s.times[i]) + '</div>' +
                  '<p class="locked-note">A palavra se revela nesse horário.</p>' +
                  '<button class="reveal" data-act="reveal" data-i="' + i + '">Revelar agora</button>' +
                '</div>' +
              '</article>';
            return;
          }

          var done = self.isLearned(e.word);
          html +=
            '<article class="card">' +
              '<div class="card-head"><span class="dash"></span><span class="theme-tag">' + esc(themeLabel) + ' &middot; ' + esc(s.times[i]) + '</span><span class="dash"></span></div>' +
              '<h2 class="word gold-text">' + esc(e.word) + '</h2>' +
              '<p class="word-tr">' + esc(e.tr) + '</p>' +
              '<div class="example">' +
                '<div class="example-label">Exemplo</div>' +
                '<p class="example-src">' + esc(e.ex) + '</p>' +
                '<p class="example-tr">' + esc(e.exTr) + '</p>' +
              '</div>' +
              '<button class="btn' + (done ? ' done' : '') + '" data-act="learn" data-i="' + i + '">' +
                (done ? 'Aprendida' : 'Marcar como aprendida') +
              '</button>' +
            '</article>';
        });

        return html;
      },

      learnedPanel: function () {
        var self = this;
        if (!this.learned.length) {
          return '<div class="empty"><div class="empty-mark">&#10086;</div><p>Sua coleção começa<br>com a palavra de hoje.</p></div>';
        }
        var html = '<div class="learned-list">';
        this.learned.slice().reverse().forEach(function (w, i) {
          var th = themeById(w.theme);
          var label = th ? (w.lang === 'italiano' ? th.it : th.pt) : '';
          html +=
            '<button class="learned-item" data-act="detail" data-i="' + i + '">' +
              '<div class="learned-row">' +
                '<div><div class="learned-word">' + esc(w.word) + '</div>' +
                '<div class="learned-tr">' + esc(w.tr) + '</div></div>' +
                '<div class="learned-meta">' + esc(label) + '<br>' + esc(w.date || '') + '</div>' +
              '</div>' +
              '<div class="learned-detail' + (self.openDetail === i ? ' open' : '') + '">' +
                '<p class="src">' + esc(w.ex) + '</p>' +
                '<p class="tr">' + esc(w.exTr || '') + '</p>' +
              '</div>' +
            '</button>';
        });
        return html + '</div>';
      },

      settingsPanel: function () {
        var s = this.settings;
        var html = '';

        // Idioma
        html +=
          '<div class="field">' +
            '<div class="field-head"><div class="field-title">Idioma</div></div>' +
            '<select data-act="lang" aria-label="Idioma">' +
              Object.keys(VOCAB).map(function (k) {
                return '<option value="' + k + '"' + (s.language === k ? ' selected' : '') + '>' + esc(VOCAB[k].label) + '</option>';
              }).join('') +
            '</select>' +
          '</div>';

        // Temas
        var lang = VOCAB[s.language];
        html +=
          '<div class="field">' +
            '<div class="field-head"><div class="field-title">Temas</div></div>' +
            '<p class="field-note">As palavras vêm apenas dos temas escolhidos.</p>' +
            '<div class="chips">' +
              THEMES.map(function (t) {
                var has = lang[t.id] && lang[t.id].length;
                if (!has) return '';
                var on = s.themes.indexOf(t.id) !== -1;
                var main = s.language === 'italiano' ? t.it : t.pt;
                var sub = s.language === 'italiano' ? t.pt : '';
                return '<button class="chip" aria-pressed="' + on + '" data-act="theme" data-id="' + t.id + '">' +
                  esc(main) + (sub ? '<span class="chip-sub">' + esc(sub) + '</span>' : '') + '</button>';
              }).join('') +
            '</div>' +
          '</div>';

        // Intensidade
        html +=
          '<div class="field">' +
            '<div class="field-head"><div class="field-title">Palavras por dia</div></div>' +
            '<div class="segmented">' +
              [1, 2, 3].map(function (n) {
                return '<button class="seg" aria-pressed="' + (s.perDay === n) + '" data-act="perday" data-n="' + n + '">' + n + '</button>';
              }).join('') +
            '</div>' +
          '</div>';

        // Distribuição por tema
        if (s.perDay > 1) {
          html +=
            '<div class="field">' +
              '<div class="field-head"><div class="field-title">Distribuição</div></div>' +
              '<p class="field-note">Como os temas se dividem entre as palavras do dia.</p>' +
              '<div class="segmented">' +
                '<button class="seg" aria-pressed="' + (s.mode === 'varied') + '" data-act="mode" data-m="varied">Um tema cada</button>' +
                '<button class="seg" aria-pressed="' + (s.mode === 'same') + '" data-act="mode" data-m="same">Mesmo tema</button>' +
              '</div>' +
            '</div>';
        }

        // Horários
        html +=
          '<div class="field">' +
            '<div class="field-head"><div class="field-title">Horários</div></div>' +
            '<p class="field-note">Cada palavra se revela no horário marcado.</p>' +
            '<div class="times">' +
              s.times.map(function (t, i) {
                return '<div class="time-row">' +
                  '<span class="time-label">' + esc(SLOT_NAMES[i] || ('Palavra ' + (i + 1))) + '</span>' +
                  '<input type="time" value="' + esc(t) + '" data-act="time" data-i="' + i + '" aria-label="Horário ' + (i + 1) + '">' +
                '</div>';
              }).join('') +
            '</div>' +
          '</div>';

        // Notificações
        var perm = ('Notification' in window) ? Notification.permission : 'unsupported';
        var note = 'O aviso chega enquanto o app estiver aberto. Alerta com o app fechado exige um servidor de notificações, que este site não usa.';
        if (perm === 'denied') note = 'As notificações estão bloqueadas nas permissões do navegador para este site.';
        if (perm === 'unsupported') note = 'Este navegador não oferece notificações.';

        html +=
          '<div class="field">' +
            '<div class="field-head">' +
              '<div class="field-title">Notificações</div>' +
              '<button class="switch" aria-pressed="' + (!!s.notify) + '" data-act="notify" aria-label="Notificações"><span class="knob"></span></button>' +
            '</div>' +
            '<p class="field-note" style="margin-bottom:0">' + esc(note) + '</p>' +
          '</div>';

        html +=
          '<div class="colophon">' +
            '<div class="mark gold-text">&#10086;</div>' +
            '<p>Palavra do Dia<br>Funciona sem internet depois da primeira visita.</p>' +
          '</div>';

        return html;
      },

      render: function () {
        var s = this.settings;
        var panel = this.tab === 'today' ? this.todayPanel()
                  : this.tab === 'learned' ? this.learnedPanel()
                  : this.settingsPanel();

        document.getElementById('root').innerHTML =
          '<header>' +
            '<div class="header-motif"></div>' +
            '<div class="shell">' +
              '<div class="header-inner">' +
                '<div class="brand">' +
                  '<div class="brand-name gold-text">Palavra do Dia</div>' +
                  '<div class="brand-sub">' + esc(VOCAB[s.language].label) + '</div>' +
                '</div>' +
                '<button class="bell" data-act="ring" aria-label="Ver a palavra como notificação">&#9788;</button>' +
              '</div>' +
              '<nav class="tabs" role="tablist">' +
                '<button class="tab" role="tab" aria-selected="' + (this.tab === 'today') + '" data-act="tab" data-t="today">Hoje</button>' +
                '<button class="tab" role="tab" aria-selected="' + (this.tab === 'learned') + '" data-act="tab" data-t="learned">Coleção &middot; ' + this.learned.length + '</button>' +
                '<button class="tab" role="tab" aria-selected="' + (this.tab === 'settings') + '" data-act="tab" data-t="settings">Ajustes</button>' +
              '</nav>' +
            '</div>' +
          '</header>' +
          '<main><div class="shell"><div class="panel active">' + panel + '</div></div></main>';
      },

      onEvent: function (ev) {
        var el = ev.target.closest('[data-act]');
        if (!el) return;
        var act = el.getAttribute('data-act');

        if (ev.type === 'change') {
          if (act === 'lang') this.setLanguage(el.value);
          if (act === 'time') this.setTime(parseInt(el.getAttribute('data-i'), 10), el.value);
          return;
        }
        if (ev.type !== 'click') return;

        if (act === 'tab') this.setTab(el.getAttribute('data-t'));
        else if (act === 'learn') this.toggleLearned(parseInt(el.getAttribute('data-i'), 10));
        else if (act === 'reveal') this.revealNow(parseInt(el.getAttribute('data-i'), 10));
        else if (act === 'detail') this.toggleDetail(parseInt(el.getAttribute('data-i'), 10));
        else if (act === 'theme') this.toggleTheme(el.getAttribute('data-id'));
        else if (act === 'perday') this.setPerDay(parseInt(el.getAttribute('data-n'), 10));
        else if (act === 'mode') this.setMode(el.getAttribute('data-m'));
        else if (act === 'notify') this.toggleNotify();
        else if (act === 'ring') {
          var self = this;
          this.askNotify().then(function (p) {
            if (p !== 'granted') return;
            for (var i = self.settings.perDay - 1; i >= 0; i--) {
              if (self.isUnlocked(i)) { self.notify(i); return; }
            }
            self.notify(0);
          });
        }
      },

      start: function () {
        var self = this;
        this.loadSettings();
        try { this.learned = JSON.parse(this.get('learned_v2', '[]')) || []; } catch (e) { this.learned = []; }
        try { this.notified = JSON.parse(this.get('notified', '{}')) || {}; } catch (e) { this.notified = {}; }
        try { this.revealed = JSON.parse(this.get('revealed', '{}')) || {}; } catch (e) { this.revealed = {}; }

        this.render();

        document.addEventListener('click', function (e) { self.onEvent(e); });
        document.addEventListener('change', function (e) { self.onEvent(e); });

        this.tick();
        setInterval(function () { self.tick(); }, 30000);

        // revela as palavras na virada do horário sem precisar recarregar
        setInterval(function () { if (self.tab === 'today') self.render(); }, 60000);

        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) { self.tick(); self.render(); }
        });

        this.registerSW();
      },

      registerSW: function () {
        if (!('serviceWorker' in navigator)) return;
        var self = this;
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').then(function (reg) {
            if (reg.waiting) self.showUpdate(reg.waiting);
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) self.showUpdate(nw);
              });
            });
          }).catch(function () {});

          var reloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (reloading) return;
            reloading = true;
            window.location.reload();
          });
        });
      },

      showUpdate: function (worker) {
        var slot = document.getElementById('update-slot');
        if (slot.querySelector('.update-bar')) return;
        var bar = document.createElement('div');
        bar.className = 'update-bar';
        bar.innerHTML = '<p>Uma versão nova do app está pronta.</p><button type="button">Atualizar</button>';
        bar.querySelector('button').addEventListener('click', function () {
          worker.postMessage({ type: 'SKIP_WAITING' });
        });
        slot.appendChild(bar);
      }
    };

    App.start();
    window.App = App;
  })();
  </script>
</body>
</html>
